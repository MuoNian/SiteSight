<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹭见 SiteSight · 桌面版</title>
<style>
  :root{
    --bg:#f5f3ee; --surface:#ffffff; --surface-2:#fbfaf6;
    --ink:#1c2735; --ink-2:#46525f; --ink-3:#7a8794;
    --line:#e7e2d7; --line-2:#d9d2c2;
    --accent:#c96f2a; --accent-deep:#a85a20; --accent-soft:#f7ead9;
    --ok:#2f7d5b; --ok-soft:#e3f2ea;
    --err:#b4432e; --err-soft:#fbeae5;
    --info:#3b6ea5; --info-soft:#e8f0f8;
    --warn:#a9701c; --warn-soft:#faf0dc;
    --mono:"Cascadia Mono",Consolas,"JetBrains Mono",monospace;
    --sans:"Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    --r:14px; --r-sm:10px;
    --shadow:0 8px 28px rgba(28,39,53,.08);
    --shadow-sm:0 2px 10px rgba(28,39,53,.06);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#cfc7b4;border-radius:8px;border:2px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-track{background:transparent}
  button{font-family:var(--sans)}
  :focus-visible{outline:2px solid #1f6fae;outline-offset:2px;border-radius:6px}

  .app{display:grid;grid-template-rows:58px 1fr;height:100vh}

  /* ---------- 顶部栏 ---------- */
  .topbar{
    display:flex;align-items:center;gap:14px;padding:0 22px;
    background:var(--surface);border-bottom:1px solid var(--line);
    z-index:30;
  }
  .topbar .logo{height:34px;width:auto;display:block}
  .topbar .title{font-size:1.05rem;font-weight:700;letter-spacing:.01em}
  .topbar .badge{
    font-size:.72rem;font-weight:600;color:var(--accent-deep);background:var(--accent-soft);
    border:1px solid #ecd7b8;border-radius:999px;padding:2px 10px;white-space:nowrap;
  }
  .topbar .spacer{flex:1}
  .topbar .env-chip{
    display:inline-flex;align-items:center;gap:7px;font-size:.8rem;color:var(--ink-2);
    background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;
  }
  .topbar .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
  .topbar .dot.off{background:#c2bbb0}

  /* ---------- 主体布局 ---------- */
  .shell{display:grid;grid-template-columns:224px 1fr;min-height:0}
  .sidebar{
    background:var(--surface);border-right:1px solid var(--line);
    padding:14px 10px;overflow-y:auto;
  }
  .side-item{
    display:flex;align-items:center;gap:12px;width:100%;
    padding:11px 14px;border:none;background:transparent;border-radius:var(--r-sm);
    color:var(--ink-2);font-size:.95rem;font-weight:600;cursor:pointer;text-align:left;
    transition:background 130ms ease,color 130ms ease;
  }
  .side-item:hover{background:#f3f0e9;color:var(--ink)}
  .side-item.active{background:var(--accent-soft);color:var(--accent-deep)}
  .side-item img{width:24px;height:24px;flex:none;object-fit:contain}
  .side-foot{margin-top:18px;padding:12px 14px;font-size:.74rem;color:var(--ink-3);border-top:1px dashed var(--line-2)}

  /* ---------- 内容区 ---------- */
  .content{overflow-y:auto;padding:26px 32px 60px}
  .wrap{max-width:1020px;margin:0 auto}
  .view-head{margin-bottom:20px}
  .view-head h1{font-size:1.35rem;font-weight:800;letter-spacing:.01em}
  .view-head p{color:var(--ink-3);font-size:.9rem;margin-top:3px}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow-sm)}
  .card + .card{margin-top:16px}
  .card h2{font-size:1rem;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:8px}
  .card h2 .tag{font-size:.68rem;font-weight:600;color:var(--ink-3);background:var(--surface-2);border:1px solid var(--line);padding:1px 7px;border-radius:999px}
  .card .desc{color:var(--ink-3);font-size:.86rem;margin-bottom:14px}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    border:1px solid transparent;border-radius:var(--r-sm);padding:9px 18px;
    font-size:.9rem;font-weight:600;cursor:pointer;transition:background 140ms ease,transform 140ms ease;
  }
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:var(--accent-deep)}
  .btn-ghost{background:var(--surface);border-color:var(--line-2);color:var(--ink-2)}
  .btn-ghost:hover{background:var(--surface-2);color:var(--ink)}
  .btn-ok{background:var(--ok);color:#fff}
  .btn-ok:hover{filter:brightness(.94)}
  .btn-danger{background:var(--err);color:#fff}
  .btn-danger:hover{filter:brightness(.94)}
  .btn-sm{padding:5px 12px;font-size:.8rem}

  .input{
    width:100%;padding:10px 13px;border:1px solid var(--line-2);border-radius:var(--r-sm);
    font-family:var(--sans);font-size:.9rem;color:var(--ink);background:var(--surface);
    transition:border-color 130ms ease,box-shadow 130ms ease;
  }
  .input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(201,111,42,.12)}

  .form-row{display:grid;grid-template-columns:170px 1fr auto;gap:10px;align-items:center;margin-bottom:12px}
  .form-row label{font-size:.86rem;font-weight:600;color:var(--ink-2)}
  .form-hint{font-size:.76rem;color:var(--ink-3);margin-top:4px}

  .seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
  .seg button{border:none;background:transparent;padding:9px 18px;font-size:.86rem;font-weight:600;color:var(--ink-2);cursor:pointer;border-right:1px solid var(--line)}
  .seg button:last-child{border-right:none}
  .seg button.active{background:var(--accent);color:#fff}

  /* 主页 hero */
  .hero{display:flex;gap:34px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:34px 38px;box-shadow:var(--shadow)}
  .hero .art{flex:none}
  .hero .art img{width:190px;height:auto;display:block}
  .hero h1{font-size:1.7rem;font-weight:800;letter-spacing:.01em}
  .hero .sub{color:var(--ink-3);margin-top:6px;font-size:.95rem}
  .hero .cta{margin-top:20px;display:flex;gap:10px}
  .feat{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
  .feat .f{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
  .feat .f .n{font-size:1.25rem}
  .feat .f h3{font-size:.95rem;margin:8px 0 4px}
  .feat .f p{font-size:.82rem;color:var(--ink-3)}

  /* 演示动图 */
  .demo{position:relative;overflow:hidden;border-radius:var(--r);border:1px solid var(--line);height:300px;background:#eae6dc}
  .demo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kenburns 16s ease-in-out infinite alternate}
  @keyframes kenburns{from{transform:scale(1) translate(0,0)}to{transform:scale(1.12) translate(-1.2%,1.4%)}}
  .demo .mask{position:absolute;inset:0;background:linear-gradient(180deg,rgba(28,39,53,.08),rgba(28,39,53,.55));display:flex;align-items:flex-end;padding:22px}
  .demo .mask .t{color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.45)}
  .demo .mask .t b{font-size:1.05rem}
  .demo .mask .t p{font-size:.82rem;opacity:.92}
  .steps{display:flex;gap:10px;margin-top:16px}
  .steps .st{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 15px;text-align:center;position:relative}
  .steps .st .ico{font-size:1.35rem}
  .steps .st .lbl{font-size:.82rem;font-weight:600;margin-top:5px}
  .steps .st .dst{font-size:.72rem;color:var(--ink-3)}
  .steps .st:not(:last-child)::after{content:"";position:absolute;right:-9px;top:50%;width:8px;height:2px;background:var(--line-2)}

  /* 日志 */
  .progress{height:14px;background:#ece8de;border-radius:999px;overflow:hidden;margin:10px 0 8px}
  .progress .bar{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),#e08f3f);transition:width .6s ease}
  .progress .bar.ok{background:linear-gradient(90deg,var(--ok),#56a37f)}
  .progress .bar.err{background:linear-gradient(90deg,var(--err),#d0694f)}
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
  .stat{border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 16px;background:var(--surface-2)}
  .stat .k{font-size:.74rem;color:var(--ink-3)}
  .stat .v{font-size:1.02rem;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
  .console{
    background:#101b26;color:#dbe6f0;border-radius:var(--r-sm);padding:14px 16px;
    font-family:var(--mono);font-size:.76rem;line-height:1.65;height:260px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;
  }
  .console .empty{color:#6f8296;font-style:italic}
  .errbox{border:1px solid #e6b7aa;background:var(--err-soft);border-radius:var(--r-sm);padding:14px 16px;margin-top:12px}
  .errbox b{color:var(--err)}
  .errbox pre{margin-top:8px;font-family:var(--mono);font-size:.76rem;color:#7c3a2c;white-space:pre-wrap;max-height:120px;overflow-y:auto}

  /* 成果 */
  .result-card{display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
  .result-card .thumb{width:96px;height:72px;border-radius:8px;object-fit:cover;background:#eae6dc;flex:none;border:1px solid var(--line)}
  .result-card .meta{flex:1;min-width:0}
  .result-card .meta .nm{font-weight:700;font-size:.95rem;word-break:break-all}
  .result-card .meta .ds{font-size:.78rem;color:var(--ink-3);margin-top:2px}
  .result-card .ops{display:flex;gap:8px;flex-wrap:wrap}
  .pill{display:inline-block;font-size:.68rem;font-weight:600;padding:2px 9px;border-radius:999px;margin-left:8px}
  .pill.ok{background:var(--ok-soft);color:var(--ok)}
  .pill.run{background:var(--info-soft);color:var(--info)}
  .file-row{display:flex;align-items:center;gap:12px;padding:9px 4px;border-bottom:1px dashed var(--line)}
  .file-row:last-child{border-bottom:none}
  .file-row .fn{flex:1;font-size:.86rem;word-break:break-all}
  .file-row .sz{color:var(--ink-3);font-size:.78rem;white-space:nowrap}
  .empty-hint{text-align:center;color:var(--ink-3);padding:40px 0;font-size:.9rem}

  /* 帮助 */
  details.help{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:12px;overflow:hidden}
  details.help summary{cursor:pointer;padding:16px 20px;font-weight:700;font-size:.95rem;list-style:none;display:flex;align-items:center;gap:10px}
  details.help summary::before{content:"▸";color:var(--accent);transition:transform 160ms ease}
  details.help[open] summary::before{transform:rotate(90deg)}
  details.help .body{padding:4px 22px 20px;color:var(--ink-2);font-size:.9rem}
  details.help .body ul{padding-left:20px;margin:8px 0}
  details.help .body li{margin:5px 0}
  details.help .body .hl{color:var(--accent-deep);font-weight:600}

  /* 上传区 */
  .dropzone{
    border:2px dashed var(--line-2);border-radius:var(--r);background:var(--surface-2);
    padding:34px 20px;text-align:center;cursor:pointer;transition:border-color 140ms ease,background 140ms ease;
  }
  .dropzone:hover,.dropzone.drag{border-color:var(--accent);background:var(--accent-soft)}
  .dropzone .big{font-size:2rem}
  .dropzone .t1{font-weight:700;margin-top:6px}
  .dropzone .t2{font-size:.8rem;color:var(--ink-3);margin-top:3px}
  .upload-progress{margin-top:12px;display:none}
  .upload-progress .txt{font-size:.8rem;color:var(--ink-2);margin-bottom:6px}

  .toast{
    position:fixed;right:24px;bottom:24px;z-index:99;background:var(--ink);color:#fff;
    border-radius:var(--r-sm);padding:13px 18px;font-size:.86rem;box-shadow:var(--shadow);
    opacity:0;transform:translateY(10px);transition:opacity 200ms ease,transform 200ms ease;max-width:380px;
  }
  .toast.show{opacity:1;transform:none}
  .toast.err{background:var(--err)}
  .toast.ok{background:var(--ok)}

  @media (max-width:900px){
    .shell{grid-template-columns:76px 1fr}
    .side-item span{display:none}
    .side-item{justify-content:center;padding:12px}
    .feat{grid-template-columns:1fr}
    .stat-grid{grid-template-columns:repeat(2,1fr)}
    .hero{flex-direction:column;text-align:center}
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <img class="logo" src="/assets/logo/logo_transparent_web.png" alt="鹭见 SiteSight">
    <span class="title" id="appTitle">鹭见 SiteSight</span>
    <span class="badge" id="appBadge">迭代 2</span>
    <span class="spacer"></span>
    <span class="env-chip"><span class="dot" id="odmDot"></span><span id="odmText">正在检测本机建模引擎…</span></span>
  </header>

  <div class="shell">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="content" id="content"></main>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const MENU = [
  ["home", "主页", "/assets/menu/home.png"],
  ["help", "帮助", "/assets/menu/help.png"],
  ["launch", "启动程序", "/assets/menu/launch.png"],
  ["log", "日志", "/assets/menu/log.png"],
  ["results", "成果", "/assets/menu/results.png"],
  ["settings", "设置", "/assets/menu/settings.png"],
];
const S = { view: "home", info: null, projectName: null, files: null, report: null,
            uploads: { name: null, done: 0, total: 0 }, statusTimer: null, quality: "standard",
            loadedProject: null, notifiedDone: false };

async function api(path, opts) {
  const o = opts || {};
  const r = await fetch(path, {
    method: o.method || "GET",
    headers: o.body ? { "Content-Type": "application/json" } : undefined,
    body: o.body ? JSON.stringify(o.body) : undefined,
  });
  let data = {};
  try { data = await r.json(); } catch (e) {}
  if (!r.ok && !data.ok) throw new Error(data.error || ("请求失败（" + r.status + "）"));
  return data;
}

function fmtDur(sec) {
  sec = Math.max(0, Math.round(sec || 0));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return h > 0 ? h + ":" + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0")
               : m + ":" + String(s).padStart(2, "0");
}
function fmtDate(ts) {
  const d = new Date(ts * 1000);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0") +
         " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
function toast(msg, type) {
  const t = $("#toast");
  t.textContent = msg;
  t.className = "toast show " + (type || "");
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.className = "toast", 3200);
}

/* ---------- 菜单与视图切换 ---------- */
function renderSidebar() {
  $("#sidebar").innerHTML = MENU.map(([id, label, icon]) =>
    '<button class="side-item' + (S.view === id ? " active" : "") + '" data-view="' + id + '">' +
    '<img src="' + icon + '" alt="">' +
    '<span>' + label + '</span></button>'
  ).join("") + '<div class="side-foot">本地运行 · 数据不出电脑<br>© 2026 鹭见 SiteSight</div>';
  $("#sidebar").querySelectorAll(".side-item").forEach(b => b.onclick = () => showView(b.dataset.view));
}
function showView(name) {
  S.view = name;
  renderSidebar();
  const el = $("#content");
  if (name === "home") el.innerHTML = homeHTML();
  else if (name === "help") el.innerHTML = helpHTML();
  else if (name === "launch") { el.innerHTML = launchHTML(); bindLaunch(); }
  else if (name === "log") { el.innerHTML = logHTML(); S.notifiedDone = false; startPoll(); }
  else if (name === "results") { el.innerHTML = resultsHTML(); loadResults(); }
  else if (name === "settings") { el.innerHTML = settingsHTML(); loadSettings(); }
  if (name !== "log") stopPoll();
}
function stopPoll() {
  if (S.statusTimer) { clearInterval(S.statusTimer); S.statusTimer = null; }
}

/* ---------- 主页 ---------- */
function homeHTML() {
  return '<div class="wrap">' +
    '<div class="hero">' +
      '<div class="art"><img src="/assets/logo/logo_white_bg_web.png" alt="鹭见 SiteSight"></div>' +
      '<div>' +
        '<h1>鹭见 SiteSight</h1>' +
        '<p class="sub">无人机照片一键三维建模 · AI 场地分析 · 记忆型场地报告</p>' +
        '<div class="cta">' +
          '<button class="btn btn-primary" onclick="showView(\'launch\')">开始建模</button>' +
          '<button class="btn btn-ghost" onclick="showView(\'results\')">查看成果</button>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="card" style="margin-top:16px">' +
      '<h2>产品演示 <span class="tag">示意动画</span></h2>' +
      '<p class="desc">从拍摄到成果的完整流程：上传照片 → 云端精度重建 → AI 分析场地 → 输出报告与模型。</p>' +
      '<div class="demo">' +
        '<img src="/data/demo_project/preview_ortho.png" alt="正射影像示例">' +
        '<div class="mask"><div class="t"><b>航拍照片 → 真实三维场地</b><p>正射影像与 DSM 自动生成，无需手动标定</p></div></div>' +
      '</div>' +
      '<div class="steps">' +
        '<div class="st"><div class="ico">📷</div><div class="lbl">拍摄照片</div><div class="dst">无人机环绕拍摄</div></div>' +
        '<div class="st"><div class="ico">🧊</div><div class="lbl">三维重建</div><div class="dst">点云 · 网格 · 纹理</div></div>' +
        '<div class="st"><div class="ico">📊</div><div class="lbl">AI 分析</div><div class="dst">坡度 · 高差 · 面积</div></div>' +
        '<div class="st"><div class="ico">📄</div><div class="lbl">成果报告</div><div class="dst">OBJ · PDF · 报告</div></div>' +
      '</div>' +
    '</div>' +
    '<div class="feat">' +
      '<div class="f"><div class="n">🧊</div><h3>一键三维建模</h3><p>拖入照片文件夹，自动完成空三、稠密点云、网格与纹理贴图。</p></div>' +
      '<div class="f"><div class="n">🤖</div><h3>AI 场地报告</h3><p>自动解读坡度、高差、面积等关键指标，输出中文分析简报。</p></div>' +
      '<div class="f"><div class="n">🧠</div><h3>记忆型报告</h3><p>记住你的偏好（如“突出坡度”），后续报告自动贴合你的习惯。</p></div>' +
    '</div>' +
    '<div class="card" style="margin-top:16px">' +
      '<h2>关于本项目</h2>' +
      '<p class="desc">鹭见 SiteSight 由大学生团队为黑客松打造，采用开源 OpenDroneMap 引擎，全程本地运行、数据不出电脑。</p>' +
      '<p class="desc">开源仓库：<a href="https://github.com/MuoNian/SiteSight" target="_blank" rel="noopener">github.com/MuoNian/SiteSight</a></p>' +
      '<p class="desc" style="margin-bottom:0">版权声明：© 2026 鹭见 SiteSight（MuoNian）。本软件按开源许可发布，详见随附 LICENSE 文件；Logo 及品牌素材版权归项目团队所有。</p>' +
    '</div>' +
  '</div>';
}

/* ---------- 帮助 ---------- */
function helpHTML() {
  return '<div class="wrap">' +
    '<div class="view-head"><h1>帮助</h1><p>拍摄方法 · 硬件需求 · 使用说明</p></div>' +
    '<details class="help" open>' +
      '<summary>📷 无人机怎么拍</summary>' +
      '<div class="body"><ul>' +
        '<li><span class="hl">环绕补面：</span>围绕目标建筑或场地缓慢环绕拍摄，确保每个面都被拍到。</li>' +
        '<li><span class="hl">重叠率：</span>相邻照片重叠率建议在 <b>60%–80%</b>，太少会重建失败，太多会拖慢速度。</li>' +
        '<li><span class="hl">高度分层：</span>至少 2–3 个高度（高处全景 + 低处细节），立体感更强。</li>' +

function bindLaunch() {
  const dz = $("#dropzone"), pick = $("#folderPick");
  dz.onclick = () => pick.click();
  dz.ondragover = e => { e.preventDefault(); dz.classList.add("drag"); };
  dz.ondragleave = () => dz.classList.remove("drag");
  dz.ondrop = e => {
    e.preventDefault(); dz.classList.remove("drag");
    const files = e.dataTransfer.files;
    if (files && files.length) uploadFiles(files);
  };
  pick.onchange = () => { if (pick.files.length) uploadFiles(pick.files); };
  $("#segQuality").querySelectorAll("button").forEach(b => b.onclick = () => {
    $("#segQuality").querySelectorAll("button").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    S.quality = b.dataset.q;
    $("#qualityHint").textContent = {
      fast: "快速模式：大幅缩短时间，适合快速验证与现场演示。",
      standard: "标准模式：兼顾速度与质量，适合大多数场地。",
      high: "高精度模式：输出更精细的模型与 DSM，耗时更长。",
    }[S.quality];
  });
}
function setReady(text, enable) {
  $("#readyInfo").textContent = text;
  $("#startBtn").disabled = !enable;
}
async function uploadFiles(fileList) {
  const files = Array.from(fileList).filter(f => /\.jpe?g$/i.test(f.name));
  if (files.length < 2) { toast("至少需要 2 张 JPG 照片", "err"); return; }
  try {
    const r = await api("/api/new-project", { method: "POST" });
    S.uploads = { name: r.name, done: 0, total: files.length };
    S.projectName = r.name;
    $("#uploadProg").style.display = "block";
    $("#uploadTxt").textContent = "正在上传照片… 0 / " + files.length;
    for (let i = 0; i < files.length; i++) {
      const f = files[i];
      await fetch("/?name=" + encodeURIComponent(r.name) + "&rel=" + encodeURIComponent(f.name), {
        method: "PUT", body: f,
      });
      S.uploads.done = i + 1;
      $("#uploadTxt").textContent = "正在上传照片… " + S.uploads.done + " / " + files.length;
      $("#uploadBar").style.width = Math.round(S.uploads.done / files.length * 100) + "%";
    }
    $("#uploadTxt").textContent = "照片上传完成：" + files.length + " 张";
    $("#pickedInfo").innerHTML = '<p class="form-hint" style="color:var(--ok)">✓ 已选择 ' + files.length + ' 张照片，可开始建模。</p>';
    setReady("已就绪：" + files.length + " 张照片（项目 " + r.name + "）", true);
  } catch (e) {
    toast(e.message, "err");
  }
}
async function usePath() {
  const p = $("#pathInput").value.trim();
  if (!p) { toast("请先粘贴照片文件夹路径", "err"); return; }
  S.projectName = null; S.uploads = { name: null, done: 0, total: 0 };
  $("#pickedInfo").innerHTML = '<p class="form-hint">✓ 将直接使用该路径下的照片进行建模。</p>';
  setReady("已指定照片路径", true);
}
async function startJob() {
  const body = { quality: S.quality };
  if (S.uploads.name) body.name = S.uploads.name;
  const p = $("#pathInput") ? $("#pathInput").value.trim() : "";
  if (p && !S.uploads.name) body.path = p;
  try {
    const r = await api("/api/start", { method: "POST", body });
    toast("建模已启动，共 " + r.count + " 张照片", "ok");
    showView("log");
  } catch (e) {
    toast(e.message, "err");
  }
}

        '<div class="stat"><div class="k">已进行</div><div class="v" id="stElapsed">00:00</div></div>' +

        '<div class="stat"><div class="k">状态</div><div class="v" id="stStatus">—</div></div>' +
      '</div>' +

      '<button class="btn btn-ghost" onclick="showView(\'results\')">成果</button>' +

      '<button class="btn btn-danger" onclick="quitApp()">结束程序</button>' +
    '</div>' +
  '</div>';
}
function startPoll() {
  stopPoll();
  let tick = 0;
  const fn = async () => {
    try {
      const s = await api("/api/status");
      renderStatus(s);
      if (tick++ % 3 === 0 && S.view === "results") loadResults();
      if (s.running) S.notifiedDone = false;
      if (S.lastStatus && S.lastStatus.running && !s.running && s.finished && S.view === "log" && !S.notifiedDone) {
        S.notifiedDone = true;
        if (s.success) toast("建模完成！可到成果页查看", "ok");
        else toast("任务未成功，请查看下方错误诊断", "err");
      }
    } catch (e) {}
  };
  fn();
  S.statusTimer = setInterval(fn, 2000);
}
async function quitApp() {
  const running = S.lastStatus && S.lastStatus.running;
  const msg = running
    ? "当前有建模任务正在运行，结束程序将终止该任务。确定结束吗？"
    : "确定要结束鹭见 SiteSight 吗？";
  if (!confirm(msg)) return;
  try { await api("/api/shutdown", { method: "POST" }); } catch (e) {}
  setTimeout(() => { try { window.close(); } catch (e) {} }, 400);
}
function renderStatus(s) {
  $("#logTitle").textContent = "任务进度" + (s.name ? " · " + s.name : "");
  $("#logBar").style.width = (s.pct || 0) + "%";
  $("#logBar").className = "bar" + (s.finished ? (s.success ? " ok" : " err") : "");
  $("#stStage").textContent = s.stage || "—";
  $("#stElapsed").textContent = fmtDur(s.elapsed);
  $("#stEta").textContent = s.eta != null ? "约 " + fmtDur(s.eta) : (s.finished ? "已完成" : "计算中…");
  $("#stStatus").textContent = !s.running && !s.finished ? "未开始" : (s.running ? "运行中" : (s.success ? "成功" : "失败"));
  $("#stStatus").style.color = !s.running && s.finished ? (s.success ? "var(--ok)" : "var(--err)") : "";
  const box = $("#errBox");
  if (s.error_summary && s.error_summary.tip) {
    box.style.display = "block";
    box.innerHTML = "<b>⚠ 处理未成功</b><br><span>" + s.error_summary.tip + "</span>" +
      (s.error_summary.lines.length ? "<pre>" + s.error_summary.lines.map(esc).join("\n") + "</pre>" : "");
  } else {
    box.style.display = "none";
  }
  const c = $("#console");
  if (s.log && s.log.length) {
    c.innerHTML = s.log.map(esc).join("\n");
    c.scrollTop = c.scrollHeight;
  }
  $("#openFolderBtn").style.display = (s.finished && s.name) ? "" : "none";
  S.lastStatus = s;
}
function esc(t) {
  return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
async function openCurrentFolder() {
  const s = S.lastStatus;
  if (!s || !s.name) return;
  try { await api("/api/open-folder?name=" + encodeURIComponent(s.name)); } catch (e) { toast(e.message, "err"); }
}

function resultsHTML() {
  return '<div class="wrap">' +
    '<div class="view-head"><h1>成果</h1><p>每次完成的成果都在这里，支持打开文件夹、下载与 AI 分析</p></div>' +

async function loadResult(name) {
  try {
    if (name === "demo_project") { await api("/api/demo", { method: "POST" }); }
    else {
      const rs = await api("/api/results");
      const sep = rs.root.endsWith("\\") || rs.root.endsWith("/") ? "" : "\\";
      await api("/api/load-project", { method: "POST", body: { path: rs.root + sep + name } });
    }
    S.loadedProject = name;
    const files = await api("/api/files");
    S.files = files;
    renderDetail(name, files);
  } catch (e) {
    toast("加载失败：" + e.message, "err");
  }

async function analyzeProject() {
  if (!S.loadedProject) return;
  const b = $("#anaBtn");
  b.disabled = true; b.textContent = "分析中…（调用 AI，可能需几十秒）";
  try {
    const r = await api("/api/analyze?name=" + encodeURIComponent(S.loadedProject));
    S.report = r;
    const box = $("#reportBox");
    box.innerHTML = '<div class="card" style="background:var(--surface-2)"><h2>分析报告</h2><div style="white-space:pre-wrap;font-size:.88rem">' + esc(r.content) + '</div>' +
      (r.preferences && r.preferences.length ? '<p class="form-hint" style="margin-top:10px">已应用偏好：' + esc(r.preferences.join("；")) + '</p>' : "") +
      '</div>';
    $("#showReportBtn").style.display = "none";
  } catch (e) { toast("生成失败：" + e.message, "err"); }
  b.disabled = false; b.textContent = "生成分析报告";
}
function showReport() {
  if (S.report) {
    $("#reportBox").innerHTML = '<div class="card" style="background:var(--surface-2)"><div style="white-space:pre-wrap;font-size:.88rem">' + esc(S.report.content) + '</div></div>';
  }
}
async function sendFeedback() {
  const t = $("#fbInput").value.trim();
  if (!t) { toast("请先输入你的偏好", "err"); return; }
  try { await api("/api/feedback", { method: "POST", body: { text: t } });
    toast("偏好已记住", "ok"); $("#fbInput").value = ""; }
  catch (e) { toast(e.message, "err"); }
}

/* ---------- 设置 ---------- */
function settingsHTML() {
  return '<div class="wrap">' +
    '<div class="view-head"><h1>设置</h1><p>成果与临时文件位置 · 外部 API 接入</p></div>' +
    '<div class="card">' +
      '<h2>📁 文件位置</h2>' +
      '<p class="desc">默认与程序安装目录保持一致；按需修改后立即生效，正在处理的任务不受影响。</p>' +
      '<div class="form-row"><label>成果目录</label>' +
        '<div><input class="input" id="setResults" placeholder="成果保存位置"><p class="form-hint" id="setResultsHint"></p></div>' +
        '<button class="btn btn-ghost btn-sm" onclick="savePaths()">保存</button></div>' +
      '<div class="form-row"><label>临时目录</label>' +
        '<div><input class="input" id="setTemp" placeholder="临时文件位置"><p class="form-hint">用于存放处理过程中的临时文件，建议与成果目录在同一磁盘。</p></div>' +
        '<button class="btn btn-ghost btn-sm" onclick="savePaths()">保存</button></div>' +
    '</div>' +
    '<div class="card">' +
      '<h2>🔌 外部 API 接入</h2>' +
      '<p class="desc">用于 AI 场地分析报告。未配置时自动使用离线模板报告；当前版本的 AI 分析需要联网调用外部 API。</p>' +
      '<div id="providerRows"></div>' +
      '<div style="margin-top:14px;display:flex;gap:8px;align-items:center">' +
        '<button class="btn btn-primary btn-sm" onclick="saveProviders()">保存 API 配置</button>' +
        '<span class="form-hint" id="apiStatus"></span>' +
      '</div>' +
    '</div>' +
    '<div class="card">' +
      '<h2>ℹ️ 关于</h2>' +
      '<p class="desc" id="aboutText">鹭见 SiteSight · 本地三维建模与 AI 场地分析工具。</p>' +
    '</div>' +
  '</div>';
}
async function loadSettings() {
  try {
    const r = await api("/api/settings");
    $("#setResults").value = r.results_dir;
    $("#setTemp").value = r.temp_dir;
    $("#setResultsHint").textContent = "默认：" + r.default_results_dir;
    $("#aboutText").textContent = "鹭见 SiteSight · " + (S.info ? S.info.version + " · " + S.info.iteration : "") + " · 本地三维建模与 AI 场地分析工具";
    const rows = r.providers && r.providers.length ? r.providers : [{ name: "", base_url: "", model: "", has_key: false, key_tail: "" }];
    $("#providerRows").innerHTML = rows.map((p, i) => providerRow(p, i)).join("") +
      '<button class="btn btn-ghost btn-sm" onclick="addProviderRow()">+ 添加供应商</button>';
    $("#apiStatus").textContent = r.api_configured ? "✓ 已配置 API" : "未配置 API（使用离线模板报告）";
  } catch (e) { toast(e.message, "err"); }
}
function providerRow(p, i) {
  return '<div class="provider-row" style="border:1px solid var(--line);border-radius:var(--r-sm);padding:14px;margin-bottom:12px">' +
    '<div class="form-row" style="grid-template-columns:90px 1fr"><label>名称</label>' +
    '<input class="input" data-pk="name" value="' + esc(p.name || "") + '" placeholder="如：主供应商"></div>' +
    '<div class="form-row" style="grid-template-columns:90px 1fr"><label>API 地址</label>' +
    '<input class="input" data-pk="base_url" value="' + esc(p.base_url || "") + '" placeholder="https://api.example.com/v1"></div>' +
    '<div class="form-row" style="grid-template-columns:90px 1fr"><label>模型</label>' +
    '<input class="input" data-pk="model" value="' + esc(p.model || "") + '" placeholder="如 gpt-4o-mini"></div>' +
    '<div class="form-row" style="grid-template-columns:90px 1fr"><label>API Key</label>' +
    '<div><input class="input" type="password" data-pk="api_key" placeholder="' + (p.has_key ? "已配置（留空保持不变）" : "粘贴你的 Key") + '">' +
    (p.has_key ? '<p class="form-hint">已配置，尾号 …' + esc(p.key_tail || "") + '</p>' : "") + '</div></div>' +
    '<button class="btn btn-ghost btn-sm" onclick="this.closest(\'.provider-row\').remove()">移除</button>' +
    '</div>';
}
function addProviderRow() {
  const box = $("#providerRows");
  box.insertAdjacentHTML("beforeend", providerRow({ name: "", base_url: "", model: "", has_key: false }, 99));
}
async function savePaths() {
  try {
    const r = await api("/api/settings", {
      method: "POST",
      body: { results_dir: $("#setResults").value.trim(), temp_dir: $("#setTemp").value.trim() },
    });
    toast("已保存：" + (r.changed.length ? r.changed.join("、") : "无变化"), "ok");
  } catch (e) { toast(e.message, "err"); }
}
async function saveProviders() {
  const providers = Array.from(document.querySelectorAll(".provider-row")).map(row => ({
    name: row.querySelector('[data-pk="name"]').value.trim(),
    base_url: row.querySelector('[data-pk="base_url"]').value.trim(),
    model: row.querySelector('[data-pk="model"]').value.trim(),
    api_key: row.querySelector('[data-pk="api_key"]').value.trim(),
  })).filter(p => p.name || p.base_url || p.api_key);
  try {
    await api("/api/settings", { method: "POST", body: { providers } });
    toast("API 配置已保存", "ok");
    loadSettings();
  } catch (e) { toast(e.message, "err"); }
}

/* ---------- 初始化 ---------- */
(async function init() {
  try {
    S.info = await api("/api/info");
    $("#appTitle").textContent = S.info.app_name || "鹭见 SiteSight";
    $("#appBadge").textContent = (S.info.iteration || "迭代 2") + " · v" + (S.info.version || "1.0.0");
    const dot = $("#odmDot"), txt = $("#odmText");
    if (S.info.odm_available) { dot.className = "dot"; txt.textContent = "本机建模引擎就绪"; }
    else { dot.className = "dot off"; txt.textContent = "未检测到建模引擎（演示模式）"; }
  } catch (e) {
    $("#odmText").textContent = "服务连接异常";
  }
  renderSidebar();
  showView("home");
})();
</script>
</body>
</html>
