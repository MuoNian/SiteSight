    <text x="200" y="392" text-anchor="middle" font-size="17" font-weight="700" fill="#1C2735">L·鹭 · 字母融合</text>
    <text x="200" y="416" text-anchor="middle" font-size="13.5" fill="#6B7A8A">字标 L + 白鹭栖息剪影</text>
    <text x="200" y="438" text-anchor="middle" font-size="13.5" fill="#6B7A8A">首字母即品牌，鹭落字上、观测点睛</text>
  </g>

  <!-- ============ 方案 3 鹭见 · 负空间 ============ -->
  <g transform="translate(800,0)">
    <defs>
      <clipPath id="lens">
        <circle cx="200" cy="190" r="112"/>
      </clipPath>
    </defs>
    <circle cx="200" cy="190" r="112" fill="none" stroke="#1C2735" stroke-width="7"/>
    <g clip-path="url(#lens)">
      <rect x="80" y="70" width="240" height="124" fill="#F7F2E8"/>
      <rect x="80" y="194" width="240" height="130" fill="#1C2735"/>
      <g fill="#1C2735">
        <circle cx="182" cy="136" r="9"/>
        <polygon points="170,134 142,130 170,142"/>
        <path d="M178 142 L185 140 L190 176 L181 178 Z"/>
        <ellipse cx="210" cy="176" rx="22" ry="13" transform="rotate(-10 210 176)"/>
        <polygon points="228,168 244,172 232,182"/>
        <rect x="200" y="186" width="3" height="8"/>
        <rect x="212" y="186" width="3" height="8"/>
      </g>
      <g fill="#F7F2E8">
        <polygon points="140,194 160,194 152,220 132,220"/>
        <polygon points="186,194 200,194 206,228 180,228"/>
        <rect x="199" y="180" width="3" height="14"/>
        <polygon points="228,194 248,194 242,212 222,212"/>
      </g>
      <path d="M116 246 C146 238 176 252 206 244 S266 238 292 250" fill="none" stroke="#F7F2E8" stroke-width="2.5" stroke-linecap="round"/>
