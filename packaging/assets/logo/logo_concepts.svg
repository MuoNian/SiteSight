      <rect x="198" y="298" width="4" height="16" rx="2"/>
      <rect x="74" y="188" width="16" height="4" rx="2"/>
      <rect x="310" y="188" width="16" height="4" rx="2"/>
    </g>
    <text x="200" y="392" text-anchor="middle" font-size="17" font-weight="700" fill="#1C2735">鹭见 · 负空间</text>
    <text x="200" y="416" text-anchor="middle" font-size="13.5" fill="#6B7A8A">镜头视野 + 鹭与场地倒影</text>
    <text x="200" y="438" text-anchor="middle" font-size="13.5" fill="#6B7A8A">鹭之所见即场地，负空间藏城市天际线</text>
  </g>

