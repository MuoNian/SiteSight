    <rect x="292" y="140" width="12" height="5" fill="#FFFFFF"/>
    <text x="200" y="392" text-anchor="middle" font-size="17" font-weight="700" fill="#1C2735">鹭印 · 篆刻印章</text>
    <text x="200" y="416" text-anchor="middle" font-size="13.5" fill="#6B7A8A">朱文印 + 肖形鹭</text>
    <text x="200" y="438" text-anchor="middle" font-size="13.5" fill="#6B7A8A">东方印章气韵，鹭见即“路见”</text>
  </g>
</svg>
