      <circle cx="256" cy="120" r="7" fill="#FFFFFF" stroke="none"/>
      <path d="M262 126 C258 141 268 148 264 160" stroke-width="4"/>
      <ellipse cx="282" cy="172" rx="24" ry="15" fill="#FFFFFF" stroke="none"/>
