    <text x="200" y="416" text-anchor="middle" font-size="13.5" fill="#6B7A8A">罗盘环抱场地 + 展翅鹭</text>
    <text x="200" y="438" text-anchor="middle" font-size="13.5" fill="#6B7A8A">测绘徽章气质，权威而稳定</text>
  </g>

  <!-- ============ 方案 6 鹭印 · 篆刻印章 ============ -->
  <g transform="translate(800,480)">
