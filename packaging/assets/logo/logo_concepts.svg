    <polygon points="118,160 152,120 248,120 282,160 248,200 152,200" fill="#22344C"/>
    <polygon points="248,120 282,160 282,176 248,216" fill="#16222F"/>
    <polygon points="152,120 118,160 118,176 152,216" fill="#1C2B3D"/>
    <polygon points="150,105 176,72 224,72 250,105 224,138 176,138" fill="#1A2B42"/>
    <polygon points="224,72 250,105 250,118 224,151" fill="#121D29"/>
    <polygon points="176,72 150,105 150,118 176,151" fill="#16232F"/>
    <circle cx="228" cy="100" r="5" fill="#C96F2A"/>
    <g fill="#F5EFE2">
      <polygon points="200,20 150,72 200,56"/>
      <polygon points="200,20 250,72 200,56"/>
      <polygon points="200,20 190,76 210,76"/>
      <polygon points="190,76 176,86 192,82"/>
      <polygon points="210,76 224,80 210,68"/>
    </g>
    <text x="200" y="392" text-anchor="middle" font-size="17" font-weight="700" fill="#1C2735">格鹭 · 几何秩序</text>
    <text x="200" y="416" text-anchor="middle" font-size="13.5" fill="#6B7A8A">等距地形网格 + 三角白鹭</text>
    <text x="200" y="438" text-anchor="middle" font-size="13.5" fill="#6B7A8A">无人机视野下的场地，理性而国际化</text>
  </g>

  <!-- ============ 方案 5 鹭徽 · 对称徽记 ============ -->
  <g transform="translate(400,480)">
    <circle cx="200" cy="190" r="116" fill="#FFFFFF" stroke="#1C2735" stroke-width="3.5"/>
    <circle cx="200" cy="190" r="96" fill="none" stroke="#1C2735" stroke-width="1.2"/>
