<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <!-- ============ 极简方案 A 驻立鹭影 ============ -->
  <g transform="translate(0,0)">
    <path d="M108 148
             C 118 138 130 130 142 128
             C 148 116 162 114 168 124
             C 176 132 174 148 170 162
             C 166 178 172 192 178 204
             C 190 196 210 192 230 194
             C 248 196 258 202 262 212
             C 266 220 258 226 248 224
             C 232 220 218 228 210 240
             C 202 250 190 250 182 242
             C 172 232 168 216 166 200
             C 162 180 156 162 148 152
             C 140 146 122 150 108 148 Z"
          fill="#1C2735"/>
    <polygon points="180,240 190,240 192,306 182,306" fill="#1C2735"/>
    <polygon points="212,240 222,240 224,306 214,306" fill="#1C2735"/>
    <text x="200" y="360" text-anchor="middle" font-size="16" font-weight="700" fill="#1C2735">驻立鹭影</text>
    <text x="200" y="383" text-anchor="middle" font-size="12.5" fill="#8A97A5">单一剪影，长颈长腿，即鹭的全部特征</text>
  </g>

  <!-- ============ 极简方案 B 俯视鹭机（主推） ============ -->
  <g transform="translate(400,0)">
    <path d="M88 192
             C 100 182 112 178 122 180
             C 128 174 138 172 142 176
             C 140 184 142 192 146 198
             C 154 194 164 192 174 192
             C 186 192 200 180 210 160
             C 220 142 226 134 226 132
             C 222 144 212 158 200 168
             C 192 176 186 186 188 192
             C 206 196 222 200 236 204
             C 246 208 250 208 250 206
             C 248 212 242 214 234 212
             C 222 210 204 212 190 216
             C 176 220 162 214 154 206
             C 148 202 140 200 132 200
             C 116 200 98 198 88 192 Z"
          fill="#1C2735"/>
    <circle cx="118" cy="182" r="6" fill="#C96F2A"/>
    <text x="200" y="360" text-anchor="middle" font-size="16" font-weight="700" fill="#1C2735">展翅飞鹭</text>
    <text x="200" y="383" text-anchor="middle" font-size="12.5" fill="#8A97A5">一条连续剪影，长颈前伸、展翅上扬</text>
  </g>

  <!-- ============ 极简方案 C 圆月鹭影 ============ -->
  <g transform="translate(800,0)">
    <circle cx="200" cy="185" r="118" fill="#1C2735"/>
    <g transform="translate(200 220) scale(1.18) translate(-200 -220)">
      <path d="M168 205
             C 172 196 180 192 188 192
             C 192 184 202 182 206 188
             C 210 194 208 202 206 210
             C 204 218 208 226 212 232
             C 220 228 232 226 242 228
             C 250 230 254 234 252 240
             C 250 246 244 248 238 246
             C 228 242 220 246 216 254
             C 212 260 206 260 202 254
             C 198 248 196 238 196 230
             C 194 222 186 218 180 216
             C 174 214 170 210 168 205 Z"
          fill="#F7F2E8"/>
      <path d="M196 254 V296 M210 254 V296" stroke="#F7F2E8" stroke-width="6" stroke-linecap="round"/>
    </g>
    <circle cx="158" cy="162" r="7" fill="#C96F2A"/>
    <text x="200" y="360" text-anchor="middle" font-size="16" font-weight="700" fill="#1C2735">圆月鹭影</text>
    <text x="200" y="383" text-anchor="middle" font-size="12.5" fill="#8A97A5">深蓝圆月 + 白鹭剪影，一色一形一记忆点</text>
  </g>
</svg>
